name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

  no-openssl:
    name: no openssl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Belt and braces. cargo-deny enforces the policy declaratively; the
      # cargo tree check catches the same thing even if deny.toml is edited,
      # and prints the dependency path that introduced it.
      # --target all, because deny.toml checks every target and a
      # platform-gated openssl-sys would otherwise slip past the host-only view.
      - name: Resolve dependency graph
        run: cargo tree --workspace --all-features --target all > /tmp/tree.txt

      - name: Assert no OpenSSL
        run: |
          # openssl-probe is deliberately absent from this list, matching
          # deny.toml: it locates certificate files and has no OpenSSL
          # system-library coupling. See the note there, including the call
          # path the allowance depends on.
          if grep -Eiq '(^|[^a-z-])(openssl|openssl-sys|openssl-src|native-tls|tokio-native-tls|hyper-tls|aws-lc-rs|aws-lc-sys)([^a-z-]|$)' /tmp/tree.txt; then
            echo "::error::A banned TLS backend entered the dependency graph."
            echo
            echo "Offending paths:"
            cargo tree --workspace --all-features --invert openssl-sys 2>/dev/null || true
            cargo tree --workspace --all-features --invert aws-lc-sys 2>/dev/null || true
            echo
            echo "Pigeon builds without OpenSSL. See deny.toml for the reasoning."
            exit 1
          fi
          echo "No OpenSSL in the dependency graph."

      # The `rsa` advisory exception in deny.toml rests on Pigeon never
      # decrypting. That is an argument about the code, so the code is checked:
      # a decryption call would make the exception false without changing the
      # dependency graph, and nothing else would notice.
      - name: Assert no RSA decryption
        run: |
          if grep -rnE '\b(decrypt|decrypt_blinded|Pkcs1v15Encrypt|Oaep)\b' crates/ --include='*.rs'; then
            echo "::error::RSA decryption reached the source tree."
            echo
            echo "deny.toml ignores RUSTSEC-2023-0071 on the grounds that Pigeon"
            echo "only ever generates keys and never decrypts. That is no longer true."
            exit 1
          fi
          echo "No RSA decryption in the source tree."

      # The same exception also rests on `rsa` being reachable only through
      # key generation. `mail-auth` can pull it in through its `generate` or
      # `rust-crypto` features, and enabling one would make the argument false
      # without changing a line of Pigeon's own code — signing would silently
      # move off `ring` and onto the crate with the advisory.
      - name: Assert mail-auth does not reach rsa
        run: |
          if cargo tree --workspace --all-features --target all --invert rsa \
             | grep -q 'mail-auth'; then
            echo "::error::mail-auth is now a path to the rsa crate."
            echo
            echo "deny.toml ignores RUSTSEC-2023-0071 because rsa only ever"
            echo "generates keys here. Signing must stay on ring. Check that"
            echo "mail-auth's generate/rust-crypto features are still off."
            exit 1
          fi
          echo "rsa is reachable only through pigeon-auth key generation."

      # SRS tag comparison must be constant-time (M2-DESIGN.md §5.2). No test
      # can catch this: a `==` comparison is functionally identical and only
      # differs in timing, so every SRS test passes with the property gone.
      # Mutation-checked and confirmed uncatchable, which is exactly when a
      # source guard is the right instrument.
      - name: Assert constant-time SRS tag comparison
        run: |
          # Scoped to the comparison itself, not the file. A bare `grep ct_eq`
          # over the whole source matches the comment that explains why the
          # call is there, so deleting the call and keeping the comment — the
          # single most likely way this regresses — would pass.
          if ! awk '/fn match_tag/,/^    }$/' crates/pigeon-auth/src/srs.rs \
             | grep -v '^\s*//' \
             | grep -qE '\.ct_eq\('; then
            echo "::error::SRS tag comparison is no longer constant-time."
            echo
            echo "A byte-at-a-time compare leaks the tag prefix to anyone who"
            echo "can time a bounce, turning 2^40 guesses into 8 x 32."
            echo
            echo "No test can catch this: == is functionally identical and"
            echo "differs only in timing. See M2-DESIGN.md 5.2."
            exit 1
          fi
          echo "SRS tag comparison uses a constant-time equality."

      # Tests must not resolve through the machine they run on. Two
      # verification tests have already failed here for an environmental
      # reason -- "no ServerAddresses key in DNS info" -- which is a test
      # reporting on a laptop rather than on the code. The offline fixture is
      # `pigeon_testkit::dns::offline_verifier`; production keeps building
      # from the system configuration and keeps failing when it cannot.
      - name: Assert integration tests do not use the system resolver
        run: |
          # A file may use it only if every test in it is ignored by default,
          # which is how the two live-DNS suites are marked.
          offenders=""
          for f in crates/*/tests/*.rs; do
            if grep -q 'from_system(' "$f" && ! grep -q '#\[ignore' "$f"; then
              offenders="$offenders $f"
            fi
          done
          if [ -n "$offenders" ]; then
            echo "::error::a test builds a resolver from the system configuration:$offenders"
            echo
            echo "Inject pigeon_testkit::dns::offline_verifier instead, or mark"
            echo "the test #[ignore] as the live-DNS suites are."
            exit 1
          fi
          echo "Integration tests resolve offline."

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins `channel = "stable"`, and rustup's directory
    # override beats the toolchain this action installs. Without the explicit
    # override below the job silently ran on current stable and could not fail,
    # which made it decorative.
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Confirm the pinned toolchain is actually in use
        run: |
          rustc --version
          rustc --version | grep -q '1\.88\.0' || {
            echo "::error::MSRV job is not running on 1.88.0"; exit 1; }
      - run: cargo check --workspace --all-features
