# Release artefacts, built from a tag.
#
# Two things make a release trustworthy: the binaries were built from the tag
# they claim, and a person can check they have not been altered since. This
# workflow does the first by building in CI from the tag itself, and the second
# with checksums plus a signature — and prints exactly how to verify both,
# because a signature nobody knows how to check is decoration.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `--locked`, so the release is built from the dependency versions the
      # repository committed to rather than whatever resolved today.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin pigeond --bin pigeon

      # The gates run on every push, but a release is the one artefact people
      # take on trust, so they run again here against the tagged tree.
      - name: Test
        run: cargo test --workspace --locked

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="pigeon-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp target/${{ matrix.target }}/release/pigeond "dist/${name}/"
          cp target/${{ matrix.target }}/release/pigeon  "dist/${name}/"
          cp README.md LICENSE* "dist/${name}/" 2>/dev/null || true
          cp -r docs "dist/${name}/docs"
          cp -r packaging "dist/${name}/packaging"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          # Checksums are generated beside the artefact and signed as a set:
          # signing each file separately means a verifier who checks one has
          # checked one.
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: One checksum file for the whole release
        run: |
          set -euo pipefail
          cd dist
          rm -f ./*.sha256
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # minisign rather than GPG: one key, one line to verify, and a public key
      # short enough to put in the README where somebody will actually see it.
      # A signature whose key is only discoverable from a keyserver is a
      # signature nobody checks.
      - name: Sign the checksums
        if: ${{ env.MINISIGN_KEY != '' }}
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_KEY" > /tmp/minisign.key
          minisign -S -s /tmp/minisign.key -m dist/SHA256SUMS \
                   -c "pigeon ${GITHUB_REF_NAME}"
          shred -u /tmp/minisign.key

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
          fail_on_unmatched_files: false
          body: |
            ## Verifying this release

            ```sh
            # the archive matches the published checksum
            sha256sum -c SHA256SUMS --ignore-missing

            # the checksums were signed by this project's key
            minisign -Vm SHA256SUMS -P <the public key from README.md>
            ```

            Checking only the checksum proves the file was not corrupted in
            transit. Checking the signature proves it is the file this project
            published. They are different questions and both are worth asking.

            ## Status of this release

            Implementation complete. Unless the release notes above link
            acceptance evidence, this build has **not** been validated against
            real providers — no confirmation that Gmail, Outlook, Yahoo,
            Fastmail or Proton authenticate its DKIM and ARC, place it in an
            inbox, or that a real bounce returns through SRS. The test suite
            does not answer those questions. See `docs/ACCEPTANCE.md`.

            See `docs/VERSIONING.md` for what this version number promises, and
            `docs/DEPLOY.md` to install.
