[package]
name = "pigeon-cli"
description = "Pigeon command line interface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[dependencies]
clap = { workspace = true }
pigeon-types = { workspace = true }
pigeon-route = { workspace = true }
rusqlite = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
pigeon-config = { workspace = true }
pigeon-db = { workspace = true }
pigeon-auth = { workspace = true }

# One current-thread runtime, for `domain check`: DNS resolution is async and
# the rest of the CLI is not. Making the whole tool async for one command would
# be paying for it to look like a daemon.
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "macros"] }
# 32 bytes from the OS for a new SRS key. Already in the graph via `rsa`;
# named here because this crate relies on it directly.
getrandom = "0.3"
rsa = { workspace = true }
pigeon-dns = { workspace = true }
# One delivery path: `alerts test` sends the way the daemon does.
pigeon-smtp = { workspace = true }
# The queue's own semantics: freezing, retrying and what counts as due.
pigeon-spool = { workspace = true }

# `statvfs`, for the free space `pigeon health` reports. Already in the graph
# through every crate that touches the filesystem; named here because this one
# calls it directly.
libc = "0.2"

[dev-dependencies]
pigeon-db = { workspace = true }
pigeon-auth = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "pigeon"
path = "src/main.rs"
