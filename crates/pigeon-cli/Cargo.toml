[package]
name = "pigeon-cli"
description = "Pigeon command line interface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[dependencies]
clap = { workspace = true }
pigeon-types = { workspace = true }
pigeon-route = { workspace = true }
rusqlite = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
pigeon-config = { workspace = true }
pigeon-db = { workspace = true }
pigeon-auth = { workspace = true }
# 32 bytes from the OS for a new SRS key. Already in the graph via `rsa`;
# named here because this crate relies on it directly.
getrandom = "0.3"
rsa = { workspace = true }
pigeon-dns = { workspace = true }

[dev-dependencies]
pigeon-db = { workspace = true }
pigeon-auth = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "pigeon"
path = "src/main.rs"
