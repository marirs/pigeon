[package]
name = "pigeon-auth"
description = "DKIM signing/verification, ARC sealing, SRS, DMARC evaluation."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[dependencies]
pigeon-types = { workspace = true }
rsa = { workspace = true }
mail-auth = { workspace = true }
mail-parser = { workspace = true }
rustls-pki-types = { workspace = true }
# Argon2id for application credentials. Password hashing is the one place a
# constant-time comparison and a memory-hard cost function are both required,
# and neither is worth hand-rolling.
argon2 = "0.5"
getrandom = "0.3"

hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

# For the offline verifier. A dev-dependency cycle — testkit depends on this
# crate — which Cargo permits precisely because it does not affect the library
# anyone builds.
pigeon-testkit = { workspace = true }
