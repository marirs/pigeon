[package]
name = "pigeond"
description = "Pigeon mail forwarding daemon."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[dependencies]
pigeon-types = { workspace = true }
pigeon-config = { workspace = true }
pigeon-db = { workspace = true }
pigeon-dns = { workspace = true }
pigeon-auth = { workspace = true }
pigeon-route = { workspace = true }
pigeon-smtp = { workspace = true }
pigeon-spool = { workspace = true }
pigeon-alert = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
pigeon-testkit = { workspace = true }
# The end-to-end tests verify the ARC set and DKIM signature the daemon
# actually transmitted, rather than asserting the headers exist.
mail-auth = { workspace = true }

[[bin]]
name = "pigeond"
path = "src/main.rs"
