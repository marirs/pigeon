[package]
name = "pigeon-testkit"
description = "Test harness: in-memory SMTP peer, fake resolver, fixtures."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[dependencies]
tokio = { workspace = true }

# For the DNS stub: a test cannot publish a DKIM record, and `mail-auth`
# consults a cache before the resolver — so serving the record from one is how
# a signature gets verified with no packet leaving the machine.
mail-auth = { workspace = true }

# For the offline verifier: `Verifier` is what the pipeline authenticates
# through, and a deterministic test has to hand it a resolver that cannot
# answer from the machine it happens to run on.
pigeon-auth = { workspace = true }
