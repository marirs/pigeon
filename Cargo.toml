[workspace]
resolver = "3"
members = [
    "crates/pigeon-types",
    "crates/pigeon-config",
    "crates/pigeon-db",
    "crates/pigeon-dns",
    "crates/pigeon-auth",
    "crates/pigeon-route",
    "crates/pigeon-smtp",
    "crates/pigeon-spool",
    "crates/pigeon-alert",
    "crates/pigeon-testkit",
    "crates/pigeond",
    "crates/pigeon-cli",
]

[workspace.package]
version      = "0.0.1"
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0"
repository   = "https://github.com/marirs/pigeon"
authors      = ["Pigeon contributors"]

# Declared centrally so crates pin one version each.
# Unused entries are never fetched; add `workspace = true` in a member to pull one in.
[workspace.dependencies]
pigeon-types   = { path = "crates/pigeon-types" }
pigeon-config  = { path = "crates/pigeon-config" }
pigeon-db      = { path = "crates/pigeon-db" }
pigeon-dns     = { path = "crates/pigeon-dns" }
pigeon-auth    = { path = "crates/pigeon-auth" }
pigeon-route   = { path = "crates/pigeon-route" }
pigeon-smtp    = { path = "crates/pigeon-smtp" }
pigeon-spool   = { path = "crates/pigeon-spool" }
pigeon-alert   = { path = "crates/pigeon-alert" }
pigeon-testkit = { path = "crates/pigeon-testkit" }

# Runtime + I/O
tokio       = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "time", "sync", "signal", "macros"] }
tokio-util  = { version = "0.7", features = ["codec"] }
bytes       = "1"

# Mail
mail-auth   = "0.7"
mail-parser = "0.11"

# DNS + TLS
hickory-resolver = "0.25"
rustls           = "0.23"
tokio-rustls     = "0.26"

# Storage
rusqlite = { version = "0.37", features = ["bundled"] }

# Plumbing
serde       = { version = "1", features = ["derive"] }
toml        = "0.9"
thiserror   = "2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap        = { version = "4", features = ["derive"] }
serde_json  = "1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

# panic = "abort" is deliberately NOT set. Pigeon parses hostile input from the
# network, and unwinding lets a panicking connection task die alone instead of
# taking every other in-flight message down with the process.
