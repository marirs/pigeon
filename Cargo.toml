[workspace]
resolver = "3"
members = [
    "crates/pigeon-types",
    "crates/pigeon-config",
    "crates/pigeon-db",
    "crates/pigeon-dns",
    "crates/pigeon-auth",
    "crates/pigeon-route",
    "crates/pigeon-smtp",
    "crates/pigeon-spool",
    "crates/pigeon-alert",
    "crates/pigeon-testkit",
    "crates/pigeond",
    "crates/pigeon-cli",
]

[workspace.package]
version      = "0.0.1"
edition      = "2024"
# Floor set by hickory-resolver 0.26, which requires 1.88.
rust-version = "1.88"
license      = "Apache-2.0"
repository   = "https://github.com/marirs/pigeon"
authors      = ["Pigeon contributors"]

# Nothing here is published yet. Declared rather than left to default for two
# reasons: `cargo publish` cannot be run by accident on a pre-1.0 workspace
# whose crate names are not reserved, and `cargo deny`'s wildcard exemption for
# internal path dependencies applies only to crates that cannot be published —
# crates.io forbids path dependencies, so for a publishable crate a versionless
# path dep really would be unresolvable.
#
# Revisit at Milestone 10, which is where package publishing is scheduled.
publish      = false

# Declared centrally so crates pin one version each.
# Unused entries are never fetched; add `workspace = true` in a member to pull one in.
[workspace.dependencies]
pigeon-types   = { path = "crates/pigeon-types" }
pigeon-config  = { path = "crates/pigeon-config" }
pigeon-db      = { path = "crates/pigeon-db" }
pigeon-dns     = { path = "crates/pigeon-dns" }
pigeon-auth    = { path = "crates/pigeon-auth" }
pigeon-route   = { path = "crates/pigeon-route" }
pigeon-smtp    = { path = "crates/pigeon-smtp" }
pigeon-spool   = { path = "crates/pigeon-spool" }
pigeon-alert   = { path = "crates/pigeon-alert" }
pigeon-testkit = { path = "crates/pigeon-testkit" }

# Runtime + I/O
tokio       = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "time", "sync", "signal", "macros"] }
tokio-util  = { version = "0.7", features = ["codec"] }
bytes       = "1"

# Mail
# Both are pure Rust and use RustCrypto primitives rather than a C backend.
# RSA key generation and parsing only. `ring` cannot generate RSA keys —
# mail-auth carries the same TODO — and every other option is a banned TLS
# backend.
#
# The feature list selects `std`, PEM encoding, the 64-bit digit representation
# and an OS RNG. It does **not** remove the decryption API: `rsa`'s features
# govern encoding and arithmetic, not which operations exist. An earlier comment
# here claimed otherwise, which would have made the deny.toml exception rest on
# something untrue.
#
# What actually holds the exception is a CI grep over the source tree for
# decryption calls — a *use* guard, not an absence. See deny.toml.
rsa         = { version = "0.9", default-features = false, features = ["std", "getrandom", "pem", "u64_digit"] }
# default-features is off because the default set pulls `aws-lc-rs`, which
# deny.toml bans: it is the cmake-requiring C crypto library `ring` was chosen
# over. `report` is off too — DMARC *evaluation* is M2, but generating
# aggregate XML reports for domain owners is a later milestone, and it costs
# `zip` and `quick-xml`.
#
# `ring` here is not only a crypto selection: it also turns on
# hickory-resolver's tls-ring, dnssec-ring and rustls-platform-verifier, which
# feature-unify onto Pigeon's own resolver. That is where `openssl-probe`
# enters the graph on Linux; see the note in deny.toml. M2-DESIGN.md §6.
mail-auth   = { version = "0.12.1", default-features = false, features = ["ring", "arc"] }
mail-parser = "0.11"

# DNS
# default-features off keeps the optional DoT/DoH backends out; they are the
# route by which a TLS stack, and with it a C crypto library, sneaks in.
# (hickory pulls rustls only behind its `tls`/`https-rustls`/`quic` features.)
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }

# TLS
#
# rustls itself is pure Rust; its crypto provider is not. Version 0.23 defaults
# to aws-lc-rs, which needs cmake and a C toolchain. `ring` is selected instead:
# still C and assembly, but vendored, no system library, and a lighter build.
#
# The pure-Rust provider (rustls-rustcrypto) is not audited for production and
# says so, which is not a trade worth making for a mail server's transport
# security.
#
# What is non-negotiable is that neither path may reach OpenSSL. CI enforces
# that; see deny.toml.
rustls          = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
tokio-rustls    = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
rustls-pemfile  = "2"
rustls-pki-types = "1"

# Storage
# `bundled` compiles SQLite from vendored C source with `cc`. That is a C
# dependency, but a self-contained one: no system library to locate, no
# pkg-config, no version skew across hosts.
rusqlite = { version = "0.40", features = ["bundled", "backup", "hooks"] }

# Migration checksums (M1-SCHEMA.md I2). Pure Rust, RustCrypto.
sha2 = "0.10"

# SRS tags: HMAC-SHA-256 truncated to 40 bits (M2-DESIGN.md §5.2).
hmac = "0.12"

# Constant-time comparison of those tags. A byte-at-a-time compare of an
# 8-character tag leaks its prefix to anyone who can measure a bounce, which
# turns 2^40 guesses into 8 x 32.
subtle = "2"

# Zeroizing<String> for DKIM private key material. Already in the graph via rsa;
# named directly so the dependency is visible where it is relied on.
zeroize = { version = "1", features = ["std"] }

# Plumbing
serde       = { version = "1", features = ["derive"] }
toml        = "1"
thiserror   = "2"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap        = { version = "4", features = ["derive", "env"] }
serde_json  = "1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

# panic = "abort" is deliberately NOT set. Pigeon parses hostile input from the
# network, and unwinding lets a panicking connection task die alone instead of
# taking every other in-flight message down with the process.
