# cargo-deny configuration.
#
#   cargo install cargo-deny
#   cargo deny check
#
# The bans section below is the load-bearing part: it is what stops OpenSSL
# from arriving as a transitive dependency of something innocuous.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack: potential key recovery through timing
    # sidechannels" in `rsa`. No fixed version exists; upstream has not shipped
    # a constant-time implementation.
    #
    # The attack is against RSA *decryption*: it needs an oracle that decrypts
    # attacker-chosen ciphertexts while the attacker measures how long each one
    # takes. Pigeon never decrypts anything. `rsa` is used for one thing —
    # generating a DKIM keypair in `pigeon domain add` — which takes no input
    # from anyone and runs once per domain.
    #
    # `ring` cannot generate RSA keys, which is why this is here at all;
    # mail-auth carries the same TODO for the same reason. Every other option is
    # a TLS backend this workspace bans.
    #
    # RustSec's own guidance is that the exposure is to *observable* private-key
    # operations, and that local use is acceptable. Pigeon's use is offline
    # generation and parsing, with no attacker anywhere near it.
    #
    # The decryption API is still compiled in — `rsa`'s features govern encoding
    # and arithmetic, not which operations exist — so this is a guard on how the
    # source uses the crate, not on what the build contains. CI greps for
    # decryption calls: see the "no RSA decryption" step in ci.yml.
    #
    # REVISIT AT MILESTONE 2, when DKIM *signing* arrives. Signing is a private
    # key operation over attacker-influenceable content, and it must use `ring`
    # rather than this crate. If signing ever needs `rsa`, this exception is no
    # longer the same argument and has to be made again from scratch.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used only to generate keys; Pigeon never decrypts" },
]

[licenses]
version = 2
# Apache-2.0 project. These are the licences it can carry without conflict.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # `ring` is a deliberate dependency (see Cargo.toml: it is rustls's crypto
    # provider, chosen over aws-lc-rs to avoid a cmake requirement). Its licence
    # file is a compound that includes this text, so the allowance is required
    # for it to pass. An earlier version of this comment claimed ring was banned
    # below; it never was, and the claim contradicted both the ban list and the
    # manifest. Remove this line only if ring itself is dropped.
    "OpenSSL",

    # `webpki-root-certs` — the Mozilla CA root bundle, which arrives with
    # `rustls-platform-verifier` (mail-auth's `ring` feature enables it on
    # hickory; see Cargo.toml).
    #
    # A *data* licence rather than a code one, which is why it is not on the
    # list above: CDLA-Permissive-2.0 grants use, modification and
    # redistribution of the data with no copyleft, no attribution requirement,
    # and no obligation attaching to anything built alongside it. Nothing in it
    # conflicts with shipping an Apache-2.0 binary.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

# Wildcard version requirements are refused, because a dependency with no
# upper bound is a supply-chain decision deferred to whatever resolves next.
#
# Internal path dependencies are exempt. The twelve crates here refer to each
# other as `{ workspace = true }` resolving to `{ path = ... }`, which carries
# no version and is not meant to: they are one unit, versioned together, and
# never resolved from a registry. Without this exemption the rule fires ten
# times on the workspace's own layout and never on a third-party crate — which
# is what it exists to catch.
#
# This was found the first time `cargo deny check` was ever run. The policy was
# written, committed, and wired into CI without once being executed against the
# repository it governs; see finding 11.
wildcards = "deny"
allow-wildcard-paths = true

# Nothing in this workspace may pull OpenSSL, directly or transitively.
#
# The concern is not C code as such. It is the system-library coupling that
# comes with it: locating a shared object at build time, matching its version
# across build and deployment hosts, and inheriting a distribution's patch
# schedule. A vendored C library has none of those properties; openssl-sys has
# all of them.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "openssl-src" },
    # openssl-probe is deliberately NOT banned. Reviewed at version 0.2.1.
    #
    # It reaches this workspace on Linux only, through
    # `mail-auth`'s `ring` feature -> `hickory-resolver/rustls-platform-verifier`
    # -> `rustls-native-certs` -> `openssl-probe`.
    #
    # What it does: locates CA certificate files and directories by reading
    # `SSL_CERT_FILE`/`SSL_CERT_DIR` and then stat-ing a compiled-in list of
    # well-known system paths. It also exposes `try_init_openssl_env_vars`, an
    # `unsafe` helper that *sets* those two variables — but nothing here calls
    # it: `rustls-native-certs-0.8.4/src/unix.rs:4` calls `probe()`, and that is
    # the only call site in the graph.
    #
    # Allowed because the ban above is about system-library coupling — locating
    # a shared object, matching versions across hosts, inheriting a
    # distribution's patch schedule — and this crate has none of it. No
    # `build.rs`, no `links` key, no dependencies, no FFI. It is named after
    # OpenSSL's filesystem conventions; it does not link, load, or require
    # OpenSSL.
    #
    # RE-AUDIT on a version bump or a change of call path. If something in the
    # graph starts calling the environment-mutating helper, this entry stops
    # being justified and the crate goes back on the list.
    { name = "native-tls" },
    { name = "tokio-native-tls" },
    { name = "hyper-tls" },
    { name = "aws-lc-rs" },   # C crypto requiring cmake; `ring` is used instead
    { name = "aws-lc-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
